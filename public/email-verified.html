<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email verified – Retro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f7f7f5;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e8e6e1;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            max-width: 460px;
            width: 100%;
            padding: 48px 40px 40px;
            text-align: center;
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .eyebrow {
            font-family: ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #8a8781;
        }

        .seal {
            width: 76px;
            height: 76px;
            margin: 22px auto 0;
        }

        .seal-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke: #10b981;
            fill: none;
            animation: draw 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .seal-check {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #10b981;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: draw 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.55s forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            margin-top: 20px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: #1a1a1a;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
            color: #55534e;
            line-height: 1.7;
        }

        .btn {
            display: inline-block;
            margin-top: 28px;
            background: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.01em;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
        }

        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0efeb;
        }

        .footer p {
            font-size: 11px;
            color: #b0ada6;
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px 32px; }
            h1 { font-size: 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .seal-circle, .seal-check { animation: none; }
            .seal-circle, .seal-check { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">Retro · Email verification</p>

        <svg class="seal" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" aria-hidden="true">
            <circle class="seal-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="seal-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>

        <h1>You're verified</h1>
        <p class="message">
            Your email is confirmed and your account is ready.
            Time to make today productive and calm.
        </p>

        <a href="/" class="btn">Continue to Retro</a>

        <div class="footer">
            <p>© <span id="year">2026</span> Retro</p>
        </div>
    </main>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
