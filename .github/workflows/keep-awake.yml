name: Keep Awake

# Pings the live service every 10 minutes so Render's free tier never hits
# its 15-minute idle sleep. Manual runs supported via workflow_dispatch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 120 https://retro-v2.onrender.com/api/v1/health
